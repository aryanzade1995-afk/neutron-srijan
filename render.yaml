# Render blueprint — the backend Netlify proxies /api/* to.
#
# This app needs a real Python process, not a serverless function: it holds a
# networkx graph and a fitted scikit-learn model in an in-process LRU pool, and
# standing up one workspace costs ~1.8s of CPU.
#
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo. Render reads
# this file and provisions all three services, wiring the connection strings in
# automatically.
#
# Free-tier caveats worth knowing before the demo:
#   * the web service sleeps after ~15 min idle; the first request afterwards
#     pays a cold start plus a workspace build. Wake it before presenting.
#   * free Postgres expires after 30 days.

# Region must match across ALL services. Render's internal hostnames
# (dpg-..., red-...) only resolve inside one region, and a first deploy with the
# web service in singapore and these defaulting elsewhere fails DNS with
# "Name or service not known" - which is exactly what happened.
databases:
  - name: muletrace-db
    plan: free
    region: singapore
    databaseName: muletrace
    user: muletrace

# Redis is commented out deliberately.
#
# Render's free Key Value tier would not provision in the web service's region -
# it kept landing in Oregon while the web service ran in Singapore, and internal
# hostnames (red-...) do not resolve across regions. A cross-region Redis would
# also need its IP allow list opened to the internet and would add ~250ms to
# every command, which is worse than not having it: the app falls back to the
# in-process store and reports that on /api/health.
#
# To enable it, put the web service in the same region as the free Key Value
# instance, uncomment this, and set MULETRACE_REDIS_URL below to fromService.
#
#  - type: redis
#    name: muletrace-cache
#    plan: free
#    maxmemoryPolicy: allkeys-lru
#    ipAllowList: []

services:
  - type: web
    name: muletrace-api
    runtime: python
    plan: free
    region: singapore        # closest region to an India-facing demo
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"

      # PostgreSQL — the system of record.
      #
      # Set in the dashboard, not bound with fromDatabase, because the free
      # database provisions in a different region to the web service and the
      # INTERNAL connection string will not resolve. Paste the database's
      # EXTERNAL URL here instead: it is reachable across regions.
      #
      # sync:false means a blueprint sync leaves whatever the dashboard holds,
      # so this cannot be silently reverted to an unreachable internal host.
      - key: MULETRACE_POSTGRES_URL
        sync: false

      # Redis — optional. Leave unset and the in-process store is used, which
      # /api/health reports honestly.
      - key: MULETRACE_REDIS_URL
        sync: false

      # Password + TOTP gate.
      - key: MULETRACE_AUTH
        value: "on"

      # The container filesystem is ephemeral, so data/users.json does not
      # survive a deploy. Pinning these means the account is recreated identically
      # on every boot instead of minting a new TOTP secret each time and forcing
      # you to re-enrol. Set them in the Render dashboard - sync:false keeps them
      # out of this file and out of git.
      - key: MULETRACE_USER
        value: investigator
      - key: MULETRACE_PASSWORD
        sync: false
      - key: MULETRACE_TOTP_SECRET
        sync: false

      # How much of the feed the rule engine treats as "now", in hours.
      - key: MULETRACE_RULE_WINDOW_HOURS
        value: "168"

      # Free tier is 0.1 CPU and 512 MB. The defaults (up to 22k transactions,
      # a 300-tree forest) are sized for a laptop and will crawl or run out of
      # memory here. These keep a first request to a few seconds.
      - key: MULETRACE_MAX_TXNS
        value: "6000"
      - key: MULETRACE_FOREST_TREES
        value: "120"
