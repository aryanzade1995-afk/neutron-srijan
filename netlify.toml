# Netlify hosts the frontend. The FastAPI backend cannot run here - Netlify
# Functions support JavaScript/TypeScript and Go, not Python, and the app holds
# live graph and fitted-model objects in an in-process LRU pool that a stateless
# function could not keep between requests.
#
# So: static assets are served from Netlify, and /api/* is proxied to a Python
# host (Render, Railway, Fly). Set BACKEND_ORIGIN below and redeploy.
#
# Without a backend the landing page still works - it falls back to the measured
# snapshot in frontend/metrics.json. The console needs the API.

[build]
  publish = "frontend"
  # metrics.json is generated locally by scripts/build_metrics.py and committed,
  # so Netlify needs no Python toolchain at build time
  command = ""

[build.environment]
  NODE_VERSION = "20"

# ---- API proxy -------------------------------------------------------------
# Deliberately still disabled, even though the backend now exists.
#
# The console authenticates with a session cookie that the FastAPI page routes
# issue when they serve /console. Proxying only /api/* would mean Netlify serves
# a static console.html that never received that cookie, so every call behind it
# would 401. Proxying the pages too would just be a slower way of being the
# backend.
#
# Instead the console links below send the browser to the backend itself, which
# serves the page and the API from one origin. One console, one dataset, no
# split brain.
#
# (A previous version of this file proxied /api/* to muletrace-api.onrender.com,
# a guessed hostname that belonged to somebody else. Never point a proxy at a
# host you have not deployed and confirmed is yours.)

# ---- clean URLs ------------------------------------------------------------
# The pages reference /assets/... because the FastAPI app mounts them there.
# On Netlify the same files sit at the publish root, so map it rather than
# rewriting every href.
[[redirects]]
  from = "/assets/*"
  to = "/:splat"
  status = 200

# The console is not hosted here. It needs the Python backend for the graph
# walk, the classifier and the session cookie, so send the browser there rather
# than serving the read-only snapshot and letting it contradict the live one.
# 302, not 301: the backend hostname is not permanent and a cached 301 would
# outlive it in every visitor's browser.
[[redirects]]
  from = "/console"
  to = "https://muletrace-api-rybn.onrender.com/console"
  status = 302
  force = true

[[redirects]]
  from = "/login"
  to = "https://muletrace-api-rybn.onrender.com/login"
  status = 302
  force = true

# ---- headers ---------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# The pages must reach the server on reload so a new dataset is issued, and the
# snapshot must not be served stale after a redeploy.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-store, must-revalidate"

[[headers]]
  for = "/metrics.json"
  [headers.values]
    Cache-Control = "no-cache"
